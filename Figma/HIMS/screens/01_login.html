<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — HIMS</title>
<link rel="stylesheet" href="../../css/style.css"/>
<style>
  body { background: linear-gradient(135deg, #0F2744 0%, #1A3C6E 50%, #0F9B8E 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:white; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:380px; padding:36px; }
  .login-logo { width:56px; height:56px; background:var(--accent); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:white; margin:0 auto 16px; }
  .login-title { text-align:center; font-size:20px; font-weight:700; }
  .login-sub { text-align:center; font-size:13px; color:var(--text-secondary); margin-top:4px; margin-bottom:28px; }
  .login-footer { text-align:center; font-size:12px; color:var(--text-secondary); margin-top:18px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">H</div>
    <div class="login-title">HIMS Portal</div>
    <div class="login-sub">Hospital Information Management System</div>

    <div class="form-group">
      <label class="form-label">Username / Employee ID<span class="req">*</span></label>
      <input class="form-control" placeholder="e.g. doc.sharma / nurse.anita"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password<span class="req">*</span></label>
      <input type="password" class="form-control" placeholder="••••••••"/>
    </div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <select class="form-control">
        <option>Front Desk / Receptionist</option>
        <option>Doctor</option>
        <option>Nurse</option>
        <option>Pharmacist</option>
        <option>Lab Technician</option>
        <option>Billing / Accounts</option>
        <option>Admin</option>
      </select>
    </div>
    <div class="flex-between mb-16">
      <label class="flex-center gap-8 text-sm"><input type="checkbox"/> Remember me</label>
      <a href="#" class="text-sm" style="color:var(--primary)">Forgot password?</a>
    </div>
    <button class="btn btn-primary w-100" style="justify-content:center;" onclick="location='02_dashboard.html'">Login</button>
    <div class="login-footer">© 2026 SG Softech · HIMS v1.0</div>
  </div>
</body>
</html>
