<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Forgot Password — IWM</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .forgot-box { background:white; border-radius:12px; padding:40px; width:420px; box-shadow:var(--shadow-lg); text-align:center; }
    .forgot-icon { font-size:56px; margin-bottom:16px; }
    .btn-full { width:100%; height:44px; background:var(--primary); color:white; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600; cursor:pointer; font-family:var(--font); }
  </style>
</head>
<body>
<div class="forgot-box">
  <div class="forgot-icon">🔓</div>
  <h2 style="font-size:22px;font-weight:700;margin-bottom:8px;">Forgot Password?</h2>
  <p style="font-size:13px;color:var(--text-secondary);margin-bottom:28px;">Enter your email and we'll send you a reset link.</p>
  <div class="form-group" style="text-align:left;">
    <label class="form-label">Email Address <span class="req">*</span></label>
    <input type="email" class="form-control" placeholder="admin@warehouse.com"/>
  </div>
  <button class="btn-full">📧 Send Reset Link</button>
  <a href="01_login.html" style="display:block;margin-top:20px;font-size:13px;color:var(--primary);">← Back to Login</a>
</div>
</body>
</html>
