// Generated by GitHub Copilot - Nov-01-2026
// Gradle init script used by Build-AndroidRelease. Contains NO secrets: the upload keystore path, alias and
// passwords are read from process environment variables set only for the duration of the build.
// Signing is assigned in AGP's finalizeDsl callback, which runs AFTER the app's build.gradle (so it overrides the
// generated debug-key assignment) and BEFORE variants are created. The build fails if release does not end up
// on the upload key, or if that key's certificate or file looks like the Android debug key.
def requiredEnv = { String name ->
    def value = System.getenv(name)
    if (value == null || value.isEmpty()) { throw new GradleException("Missing environment variable ${name}") }
    return value
}

allprojects { proj ->
    // Generated by GitHub Copilot - Nov-01-2026
    // Ninja bundled with Android CMake may still hit MAX_PATH even in a short checkout.
    ['com.android.application', 'com.android.library'].each { pluginId ->
        proj.plugins.withId(pluginId) {
            proj.extensions.getByName('androidComponents').finalizeDsl { ext ->
                if (System.getProperty('os.name').toLowerCase().contains('windows')) {
                    ext.defaultConfig.externalNativeBuild.cmake.arguments.add('-DCMAKE_OBJECT_PATH_MAX=240')
                }
            }
        }
    }
    proj.plugins.withId('com.android.application') {
        proj.extensions.getByName('androidComponents').finalizeDsl { ext ->
            def keystore = new File(requiredEnv('GARAGE_UPLOAD_KEYSTORE_FILE'))
            if (!keystore.isFile()) { throw new GradleException("Upload keystore not found: ${keystore}") }
            if (keystore.name.toLowerCase() == 'debug.keystore') { throw new GradleException('Refusing the debug keystore as upload key') }
            def upload = ext.signingConfigs.create('garageUpload')
            upload.storeFile = keystore
            upload.storePassword = requiredEnv('GARAGE_UPLOAD_STORE_PASSWORD')
            upload.keyAlias = requiredEnv('GARAGE_UPLOAD_KEY_ALIAS')
            upload.keyPassword = requiredEnv('GARAGE_UPLOAD_KEY_PASSWORD')
            ext.buildTypes.getByName('release').signingConfig = upload
            def effective = ext.buildTypes.getByName('release').signingConfig
            if (effective == null || effective.name != 'garageUpload' || effective.keyAlias == 'androiddebugkey') {
                throw new GradleException('Release build is not using the upload signing configuration')
            }
        }
    }
}